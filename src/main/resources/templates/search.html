<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>搜索 - 成人玩具商城</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .search-page {
            padding-top: 60px;
            padding-bottom: 70px;
            min-height: 100vh;
            background: #f5f5f5;
        }
        .search-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            padding: 10px 15px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 480px;
            margin: 0 auto;
        }
        .back-btn {
            color: white;
            font-size: 20px;
            text-decoration: none;
            padding: 5px;
        }
        .search-input-container {
            flex: 1;
            display: flex;
            background: white;
            border-radius: 20px;
            padding: 8px 15px;
            align-items: center;
        }
        .search-input-container input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }
        .search-input-container button {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 5px 15px;
            font-size: 14px;
            cursor: pointer;
        }
        /* Sort/filter bar */
        .search-filter-bar {
            display: flex;
            background: white;
            padding: 10px 15px;
            gap: 15px;
            border-bottom: 1px solid #eee;
        }
        .filter-item {
            font-size: 13px;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }
        .filter-item.active {
            color: #ff5722;
            border-bottom-color: #ff5722;
            font-weight: 600;
        }
        .search-results {
            padding: 15px;
            display: block;
        }
        .search-result-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .result-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-decoration: none;
            color: inherit;
        }
        .result-image {
            height: 0;
            padding-bottom: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .result-image i {
            font-size: 50px;
            color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .result-image .result-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #ff5722;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .result-info {
            padding: 10px;
        }
        .result-title {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .result-price-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .result-price {
            color: #ff5722;
            font-weight: bold;
            font-size: 16px;
        }
        .result-original-price {
            color: #999;
            font-size: 12px;
            text-decoration: line-through;
        }
        .result-sales {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        .result-stock {
            color: #999;
            font-size: 11px;
            margin-top: 3px;
        }
        .result-stock.low-stock {
            color: #ff9800;
        }
        .result-stock.out-of-stock {
            color: #f44336;
        }
        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        .no-results i {
            font-size: 60px;
            margin-bottom: 15px;
            color: #ddd;
        }
        .no-results p {
            margin-bottom: 5px;
        }
        /* Search suggestions when no keyword */
        .search-suggestions {
            padding: 15px;
        }
        .suggestion-section {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .suggestion-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .suggestion-title i {
            color: #ff5722;
        }
        .hot-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .hot-tag {
            display: inline-block;
            padding: 6px 14px;
            background: #f5f5f5;
            border-radius: 15px;
            font-size: 13px;
            color: #666;
            text-decoration: none;
            transition: all 0.2s;
        }
        .hot-tag:hover, .hot-tag:active {
            background: #ffeee6;
            color: #ff5722;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="search-page">
            <!-- 搜索头部 -->
            <div class="search-header">
                <a th:href="@{/}" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div class="search-input-container">
                    <i class="fas fa-search" style="color: #999; margin-right: 10px;"></i>
                    <form th:action="@{/search}" method="get" style="display: flex; flex: 1; align-items: center;">
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="搜索成人玩具商品">
                        <button type="submit">搜索</button>
                    </form>
                </div>
            </div>

            <!-- 排序筛选栏 (仅在有搜索关键词或有结果时显示) -->
            <div th:if="${keyword != null and keyword != ''}" class="search-filter-bar">
                <a th:href="@{/search(keyword=${keyword},sort='default')}" class="filter-item" th:classappend="${sort == null or sort == 'default'} ? ' active'">
                    <span>综合</span>
                </a>
                <a th:href="@{/search(keyword=${keyword},sort='sales')}" class="filter-item" th:classappend="${sort == 'sales'} ? ' active'">
                    <span>销量</span> <i class="fas fa-arrow-down"></i>
                </a>
                <a th:href="@{/search(keyword=${keyword},sort=${sort == 'price_asc' ? 'price_desc' : 'price_asc'})}" class="filter-item" th:classappend="${sort == 'price_asc' or sort == 'price_desc'} ? ' active'">
                    <span>价格</span>
                    <i th:if="${sort == 'price_asc'}" class="fas fa-arrow-up"></i>
                    <i th:if="${sort == 'price_desc'}" class="fas fa-arrow-down"></i>
                    <i th:if="${sort != 'price_asc' and sort != 'price_desc'}" class="fas fa-sort"></i>
                </a>
            </div>

            <!-- 搜索建议（无关键词时显示） -->
            <div th:if="${keyword == null or keyword == ''}" class="search-suggestions">
                <div class="suggestion-section">
                    <div class="suggestion-title">
                        <i class="fas fa-fire"></i> 热门搜索
                    </div>
                    <div class="hot-tags">
                        <a th:each="tag : ${hotTags}" th:href="@{/search(keyword=${tag})}" class="hot-tag" th:text="${tag}">标签</a>
                    </div>
                </div>
            </div>

            <!-- 搜索结果 -->
            <div class="search-results">
                <div th:if="${keyword != null and keyword != ''}" class="search-result-title">
                    搜索"<span th:text="${keyword}">关键词</span>"的结果，共<span th:text="${#lists.size(products)}">0</span>件商品
                </div>
                <div th:if="${keyword == null or keyword == ''}" class="search-result-title">
                    全部成人玩具商品，共<span th:text="${#lists.size(products)}">0</span>件
                </div>

                <div th:if="${#lists.isEmpty(products)}" class="no-results">
                    <i class="fas fa-search"></i>
                    <p>未找到相关商品</p>
                    <p>换个关键词试试吧</p>
                </div>

                <div th:unless="${#lists.isEmpty(products)}" class="result-grid">
                    <a th:each="product : ${products}" 
                       th:href="@{/product/{id}(id=${product.id})}" 
                       class="result-card">
                        <div class="result-image" th:style="${product.hasDisplayMedia()} ? 'background: #f5f5f5;' : 'background: linear-gradient(135deg, ' + ${product.bgColor != null ? product.bgColor : '#ffecd2, #fcb69f'} + ');'">
                            <!-- 如果有展示图片，则显示图片，否则显示图标 -->
                            <th:block th:if="${product.hasDisplayMedia()}">
                                <th:block th:if="${product.firstImageUrl != null}">
                                    <img th:src="${product.firstImageUrl}" th:alt="${product.title}" style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;"
                                         onerror="this.style.display='none'; var fb=this.nextElementSibling; if(fb) fb.style.display='block';">
                                    <i class="fas" th:classappend="${product.icon != null ? product.icon : 'fa-box'}" style="display: none;"></i>
                                </th:block>
                                <th:block th:if="${product.firstImageUrl == null and product.firstVideoUrl != null}">
                                    <video muted preload="metadata" playsinline 
                                           style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; background: #000;">
                                        <source th:src="${product.firstVideoUrl + '#t=0.5'}" type="video/mp4">
                                    </video>
                                    <i class="fas" th:classappend="${product.icon != null ? product.icon : 'fa-box'}" style="display: none;"></i>
                                    <span style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; z-index: 1;">
                                        <i class="fas fa-play"></i> 视频
                                    </span>
                                </th:block>
                            </th:block>
                            <th:block th:unless="${product.hasDisplayMedia()}">
                                <i class="fas" th:classappend="${product.icon != null ? product.icon : 'fa-box'}"></i>
                            </th:block>
                            <span class="result-tag" th:text="${product.tag}">标签</span>
                        </div>
                        <div class="result-info">
                            <h3 class="result-title" th:text="${product.title}">商品名称</h3>
                            <div class="result-price-row">
                                <span class="result-price" th:text="'¥' + ${product.price}">¥0</span>
                                <span class="result-original-price" th:if="${product.originalPrice != null and product.originalPrice > product.price}" th:text="'¥' + ${product.originalPrice}">¥0</span>
                            </div>
                            <div class="result-sales" th:text="${product.sales}">已售 0件</div>
                            <div th:if="${product.stock != null and product.stock <= 0}" class="result-stock out-of-stock">已售罄</div>
                            <div th:if="${product.stock != null and product.stock > 0 and product.stock <= 10}" class="result-stock low-stock" th:text="'仅剩' + ${product.stock} + '件'">仅剩几件</div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
        <a th:href="@{/}" class="nav-item" data-page="home">
            <i class="fas fa-house"></i>
            <span>首页</span>
        </a>
        <a th:href="@{/message}" class="nav-item" data-page="message">
            <i class="fas fa-bell"></i>
            <span>消息</span>
        </a>
        <a th:href="@{/cart}" class="nav-item" data-page="cart">
            <i class="fas fa-bag-shopping"></i>
            <span>购物车</span>
            <span class="nav-badge" id="nav-cart-badge" style="display:none;">0</span>
        </a>
        <a th:href="@{/profile}" class="nav-item" data-page="profile">
            <i class="fas fa-circle-user"></i>
            <span>我的</span>
        </a>
    </nav>

    <script>
        // 更新购物车角标
        fetch('/api/user/info')
            .then(function(r) { return r.json(); })
            .then(function(info) {
                if (info && info.cartCount > 0) {
                    var badge = document.getElementById('nav-cart-badge');
                    if (badge) { badge.textContent = info.cartCount; badge.style.display = ''; }
                }
            })
            .catch(function() {});

        // 处理视频加载错误
        document.querySelectorAll('.result-image video source').forEach(function(source) {
            source.addEventListener('error', function() {
                var video = source.parentElement;
                if (video) {
                    video.style.display = 'none';
                    var fb = video.nextElementSibling;
                    if (fb) fb.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
