<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人设置 - 成人玩具商城</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .settings-page {
            padding: 55px 0 20px 0;
            min-height: 100vh;
            background: #f5f5f5;
        }
        .page-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: white;
            padding: 12px 15px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 480px;
            margin: 0 auto;
        }
        .page-header .back-btn {
            color: #333; font-size: 18px; text-decoration: none;
        }
        .page-header h1 { font-size: 17px; color: #333; font-weight: 600; }
        .settings-section {
            background: white;
            margin: 10px;
            border-radius: 10px;
            overflow: hidden;
        }
        .settings-section-title {
            padding: 12px 15px 8px;
            font-size: 13px;
            color: #999;
            font-weight: 500;
        }
        .settings-item {
            display: flex;
            align-items: center;
            padding: 14px 15px;
            border-bottom: 1px solid #f5f5f5;
        }
        .settings-item:last-child { border-bottom: none; }
        .settings-label {
            width: 80px;
            font-size: 14px;
            color: #333;
            flex-shrink: 0;
        }
        .settings-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: #333;
            text-align: right;
            background: transparent;
        }
        .settings-input::placeholder { color: #ccc; }
        .settings-select {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: #333;
            text-align: right;
            background: transparent;
            direction: rtl;
            -webkit-appearance: none;
            appearance: none;
        }
        .settings-value {
            flex: 1;
            font-size: 14px;
            color: #999;
            text-align: right;
        }
        .settings-arrow {
            color: #ccc;
            margin-left: 8px;
            font-size: 12px;
        }
        .save-section {
            padding: 20px 15px;
        }
        .save-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff5722, #ff8a65);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .save-btn:disabled { background: #ccc; cursor: not-allowed; }
        .toast {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999;
        }
        .toast.show { display: block; }
        .avatar-section {
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .avatar-circle {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff5722, #ff8a65);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
        }
        .level-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .level-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
        }
        .level-new { background: #e8f5e9; color: #388e3c; }
        .level-normal { background: #e3f2fd; color: #1976d2; }
        .level-silver { background: #f5f5f5; color: #757575; }
        .level-gold { background: #fff8e1; color: #f57f17; }
        .level-diamond { background: #fce4ec; color: #c62828; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page active">
            <div class="settings-page">
                <div class="page-header">
                    <a th:href="@{/profile}" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                    <h1>个人设置</h1>
                </div>

                <div class="avatar-section">
                    <div class="avatar-circle">
                        <i class="fas fa-user"></i>
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-section-title">基本信息</div>
                    <div class="settings-item">
                        <span class="settings-label">昵称</span>
                        <input type="text" class="settings-input" id="settingNickname" maxlength="20" placeholder="请输入昵称">
                    </div>
                    <div class="settings-item">
                        <span class="settings-label">性别</span>
                        <select class="settings-select" id="settingGender">
                            <option value="unknown">未知</option>
                            <option value="male">男</option>
                            <option value="female">女</option>
                        </select>
                    </div>
                    <div class="settings-item">
                        <span class="settings-label">会员等级</span>
                        <span class="settings-value" id="settingLevel">
                            <span class="level-badge level-new">新用户</span>
                        </span>
                    </div>
                    <div class="settings-item">
                        <span class="settings-label">账号类型</span>
                        <span class="settings-value" id="settingUserType">游客</span>
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-section-title">联系方式</div>
                    <div class="settings-item">
                        <span class="settings-label">手机号</span>
                        <input type="tel" class="settings-input" id="settingPhone" maxlength="11" placeholder="请输入手机号码">
                    </div>
                    <div class="settings-item">
                        <span class="settings-label">邮箱</span>
                        <input type="email" class="settings-input" id="settingEmail" placeholder="请输入邮箱地址">
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-section-title">收货信息</div>
                    <div class="settings-item">
                        <span class="settings-label">地址</span>
                        <input type="text" class="settings-input" id="settingAddress" maxlength="500" placeholder="请输入收货地址">
                    </div>
                </div>

                <div class="save-section">
                    <button class="save-btn" id="saveBtn" onclick="saveSettings()">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <nav class="bottom-nav">
        <a th:href="@{/}" class="nav-item" data-page="home">
            <i class="fas fa-home"></i><span>首页</span>
        </a>
        <a th:href="@{/message}" class="nav-item" data-page="message">
            <i class="fas fa-comment-dots"></i><span>消息</span>
        </a>
        <a th:href="@{/cart}" class="nav-item" data-page="cart">
            <i class="fas fa-shopping-cart"></i><span>购物车</span>
        </a>
        <a th:href="@{/profile}" class="nav-item active" data-page="profile">
            <i class="fas fa-user"></i><span>我的</span>
        </a>
    </nav>

    <script th:src="@{/js/app.js}"></script>
    <script>
        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 2000);
        }

        function getLevelClass(level) {
            if (level === '钻石会员') return 'level-diamond';
            if (level === '金牌会员') return 'level-gold';
            if (level === '银牌会员') return 'level-silver';
            if (level === '普通会员') return 'level-normal';
            return 'level-new';
        }

        // Load user info
        fetch('/api/user/init', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function() { return fetch('/api/user/info'); })
            .then(function(r) { return r.json(); })
            .then(function(info) {
                if (info && !info.error) {
                    document.getElementById('settingNickname').value = info.nickname || '';
                    document.getElementById('settingPhone').value = info.phone || '';
                    document.getElementById('settingEmail').value = info.email || '';
                    document.getElementById('settingAddress').value = info.address || '';
                    document.getElementById('settingGender').value = info.gender || 'unknown';
                    document.getElementById('settingUserType').textContent =
                        info.userType === 'guest' ? '游客' : '注册用户';
                    if (info.level) {
                        var levelEl = document.getElementById('settingLevel');
                        levelEl.innerHTML = '<span class="level-badge ' + getLevelClass(info.level) + '">' + info.level + '</span>';
                    }
                }
            });

        function saveSettings() {
            var btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = '保存中...';

            var data = {
                nickname: document.getElementById('settingNickname').value.trim(),
                phone: document.getElementById('settingPhone').value.trim(),
                email: document.getElementById('settingEmail').value.trim(),
                address: document.getElementById('settingAddress').value.trim(),
                gender: document.getElementById('settingGender').value
            };

            fetch('/api/user/info', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(function(r) { return r.json(); })
            .then(function(result) {
                if (result.success) {
                    showToast('保存成功');
                } else {
                    showToast(result.error || '保存失败');
                }
            })
            .catch(function() { showToast('网络错误'); })
            .finally(function() {
                btn.disabled = false;
                btn.textContent = '保存修改';
            });
        }
    </script>
</body>
</html>
