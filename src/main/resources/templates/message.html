<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>消息 - 成人玩具商城</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .message-tabs { display:flex; background:#fff; padding:12px 0; border-bottom:1px solid #eee; }
        .message-tab { flex:1; text-align:center; font-size:13px; color:#666; padding:5px 0; position:relative; cursor:pointer; }
        .message-tab.active { color:#ff5722; font-weight:600; }
        .message-tab.active::after { content:''; position:absolute; bottom:-12px; left:50%; transform:translateX(-50%); width:20px; height:2px; background:#ff5722; border-radius:1px; }
        .msg-list-view { background:#fff; min-height:60vh; }
        .msg-chat-view { display:none; flex-direction:column; height:calc(100vh - 110px); background:#f5f5f5; }
        .msg-chat-view.active { display:flex; }
        .msg-chat-header { display:flex; align-items:center; padding:12px 15px; background:#fff; border-bottom:1px solid #eee; gap:10px; }
        .msg-chat-header .back-btn { font-size:18px; color:#333; cursor:pointer; }
        .msg-chat-header .chat-name { font-size:16px; font-weight:600; flex:1; }
        .msg-chat-body { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
        .msg-bubble { max-width:75%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.5; word-break:break-word; }
        .msg-bubble.received { align-self:flex-start; background:#fff; color:#333; border-bottom-left-radius:4px; }
        .msg-bubble.sent { align-self:flex-end; background:linear-gradient(135deg,#ff5722,#ff8a65); color:#fff; border-bottom-right-radius:4px; }
        .msg-bubble .bubble-time { font-size:11px; opacity:0.7; margin-top:4px; display:block; }
        .msg-input-bar { display:flex; align-items:center; padding:10px 12px; background:#fff; border-top:1px solid #eee; gap:8px; }
        .msg-input-bar input { flex:1; border:1px solid #e0e0e0; border-radius:20px; padding:8px 14px; font-size:14px; outline:none; }
        .msg-input-bar input:focus { border-color:#ff5722; }
        .msg-send-btn { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#ff5722,#ff8a65); color:#fff; border:none; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .msg-send-btn:active { opacity:0.8; }
        .msg-empty { text-align:center; padding:60px 20px; color:#999; }
        .msg-empty i { font-size:48px; margin-bottom:12px; display:block; color:#ddd; }
        .msg-card { background:#fff; border-radius:12px; margin:8px 12px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
        .msg-card .card-title { font-size:14px; font-weight:600; color:#333; margin-bottom:6px; }
        .msg-card .card-content { font-size:13px; color:#666; line-height:1.5; }
        .msg-card .card-time { font-size:11px; color:#999; margin-top:6px; }
        .notification-cards { padding:8px 0; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="page-message" class="page active">
            <div class="header">
                <h1>消息</h1>
                <div class="header-right">
                    <i class="fas fa-cog"></i>
                </div>
            </div>

            <!-- 消息分类 -->
            <div class="message-tabs" id="messageTabs">
                <div class="message-tab active" data-type="all">全部</div>
                <div class="message-tab" data-type="order">交易物流</div>
                <div class="message-tab" data-type="promo">活动</div>
                <div class="message-tab" data-type="service">服务</div>
            </div>

            <!-- 消息列表视图 -->
            <div class="msg-list-view" id="msgListView">
                <div class="message-list" id="messageList">
                    <div class="message-item" data-chat="logistics" data-type="order">
                        <div class="message-avatar" style="background: linear-gradient(135deg, #ff6b6b, #ff8e53);">
                            <i class="fas fa-truck"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-header">
                                <span class="message-title">物流通知</span>
                                <span class="message-time" id="time-logistics"></span>
                            </div>
                            <p class="message-text" id="preview-logistics">点击查看物流通知</p>
                        </div>
                        <span class="message-badge" id="badge-logistics" style="display:none;">0</span>
                    </div>
                    <div class="message-item" data-chat="store" data-type="promo">
                        <div class="message-avatar" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">
                            <i class="fas fa-store"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-header">
                                <span class="message-title">成人用品旗舰店</span>
                                <span class="message-time" id="time-store"></span>
                            </div>
                            <p class="message-text" id="preview-store">点击开始对话</p>
                        </div>
                        <span class="message-badge" id="badge-store" style="display:none;">0</span>
                    </div>
                    <div class="message-item" data-chat="promo" data-type="promo">
                        <div class="message-avatar" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">
                            <i class="fas fa-percent"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-header">
                                <span class="message-title">优惠活动</span>
                                <span class="message-time" id="time-promo"></span>
                            </div>
                            <p class="message-text" id="preview-promo">点击查看优惠活动</p>
                        </div>
                        <span class="message-badge" id="badge-promo" style="display:none;">0</span>
                    </div>
                    <div class="message-item" data-chat="service" data-type="service">
                        <div class="message-avatar" style="background: linear-gradient(135deg, #fa709a, #fee140);">
                            <i class="fas fa-headset"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-header">
                                <span class="message-title">客服小蜜</span>
                                <span class="message-time" id="time-service"></span>
                            </div>
                            <p class="message-text" id="preview-service">点击联系客服</p>
                        </div>
                        <span class="message-badge" id="badge-service" style="display:none;">0</span>
                    </div>
                    <div class="message-item" data-chat="system" data-type="service">
                        <div class="message-avatar" style="background: linear-gradient(135deg, #a18cd1, #fbc2eb);">
                            <i class="fas fa-bell"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-header">
                                <span class="message-title">系统通知</span>
                                <span class="message-time" id="time-system"></span>
                            </div>
                            <p class="message-text" id="preview-system">点击查看系统通知</p>
                        </div>
                        <span class="message-badge" id="badge-system" style="display:none;">0</span>
                    </div>
                </div>
            </div>

            <!-- 聊天详情视图 -->
            <div class="msg-chat-view" id="msgChatView">
                <div class="msg-chat-header">
                    <i class="fas fa-arrow-left back-btn" id="chatBackBtn"></i>
                    <span class="chat-name" id="chatName">客服小蜜</span>
                </div>
                <div class="msg-chat-body" id="chatBody">
                    <!-- 聊天消息会动态填充 -->
                </div>
                <div class="msg-input-bar" id="chatInputBar">
                    <input type="text" id="chatInput" placeholder="输入消息..." maxlength="500">
                    <button class="msg-send-btn" id="chatSendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav" id="bottomNav">
        <a th:href="@{/}" class="nav-item" data-page="home">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </a>
        <a th:href="@{/message}" class="nav-item active" data-page="message">
            <i class="fas fa-comment-dots"></i>
            <span>消息</span>
        </a>
        <a th:href="@{/cart}" class="nav-item" data-page="cart">
            <i class="fas fa-shopping-cart"></i>
            <span>购物车</span>
            <span class="nav-badge" id="nav-cart-badge" style="display:none;">0</span>
        </a>
        <a th:href="@{/profile}" class="nav-item" data-page="profile">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </a>
    </nav>

    <script th:src="@{/js/app.js}"></script>
    <script>
        // 更新购物车角标
        fetch('/api/user/info')
            .then(function(r) { return r.json(); })
            .then(function(info) {
                if (info && info.cartCount > 0) {
                    var badge = document.getElementById('nav-cart-badge');
                    if (badge) { badge.textContent = info.cartCount; badge.style.display = ''; }
                }
            })
            .catch(function() {});

        // 聊天类型名称映射
        var chatNames = {
            logistics: '物流通知',
            store: '成人用品旗舰店',
            promo: '优惠活动',
            service: '客服小蜜',
            system: '系统通知'
        };

        // 通知类型（以卡片形式展示，不显示输入框）
        var notificationTypes = ['logistics', 'promo', 'system'];

        var currentChat = null;

        // 初始化用户
        fetch('/api/user/init', { method: 'POST' }).catch(function() {});

        // 加载未读消息数
        function loadUnreadCounts() {
            fetch('/api/user/message/unread')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    ['logistics', 'store', 'promo', 'service', 'system'].forEach(function(type) {
                        var count = data[type] || 0;
                        var badge = document.getElementById('badge-' + type);
                        if (badge) {
                            if (count > 0) {
                                badge.textContent = count;
                                badge.style.display = '';
                            } else {
                                badge.style.display = 'none';
                            }
                        }
                    });
                })
                .catch(function() {});
        }

        // 页面加载时获取未读消息
        loadUnreadCounts();

        // Tab切换过滤
        document.querySelectorAll('#messageTabs .message-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('#messageTabs .message-tab').forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                var type = this.getAttribute('data-type');
                document.querySelectorAll('#messageList .message-item').forEach(function(item) {
                    if (type === 'all' || item.getAttribute('data-type') === type) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });

        // 点击消息项进入聊天
        document.querySelectorAll('#messageList .message-item').forEach(function(item) {
            item.addEventListener('click', function() {
                var chatId = this.getAttribute('data-chat');
                openChat(chatId);
            });
        });

        function formatTime(date) {
            return date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
        }

        function formatMessageTime(timeStr) {
            if (!timeStr) return '';
            try {
                var d = new Date(timeStr);
                var now = new Date();
                var diffMs = now.getTime() - d.getTime();
                var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                if (diffDays === 0) {
                    return formatTime(d);
                } else if (diffDays === 1) {
                    return '昨天 ' + formatTime(d);
                } else if (diffDays < 7) {
                    var days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                    return days[d.getDay()] + ' ' + formatTime(d);
                } else {
                    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + formatTime(d);
                }
            } catch (e) {
                return timeStr;
            }
        }

        function openChat(chatId) {
            currentChat = chatId;
            document.getElementById('chatName').textContent = chatNames[chatId] || chatId;
            var body = document.getElementById('chatBody');
            body.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">加载中...</div>';

            // 判断是否为通知类型（卡片展示，隐藏输入框）
            var inputBar = document.getElementById('chatInputBar');
            if (notificationTypes.indexOf(chatId) !== -1) {
                inputBar.style.display = 'none';
            } else {
                inputBar.style.display = '';
            }

            document.getElementById('msgListView').style.display = 'none';
            document.getElementById('messageTabs').style.display = 'none';
            document.getElementById('msgChatView').classList.add('active');
            document.getElementById('bottomNav').style.display = 'none';

            // 从后端加载聊天历史
            fetch('/api/user/message/history/' + chatId)
                .then(function(r) { return r.json(); })
                .then(function(messages) {
                    body.innerHTML = '';
                    if (notificationTypes.indexOf(chatId) !== -1) {
                        // 通知类型用卡片方式显示
                        if (messages.length === 0) {
                            body.innerHTML = '<div class="msg-empty"><i class="fas fa-inbox"></i>暂无通知</div>';
                        } else {
                            messages.forEach(function(msg) {
                                appendCard(msg.text, formatMessageTime(msg.time));
                            });
                        }
                    } else {
                        // 聊天类型用气泡方式显示
                        if (messages.length === 0) {
                            body.innerHTML = '<div class="msg-empty"><i class="fas fa-comment-dots"></i>暂无消息，发送一条开始对话吧</div>';
                        } else {
                            messages.forEach(function(msg) {
                                appendBubble(msg.type, msg.text, formatMessageTime(msg.time));
                            });
                        }
                    }
                    body.scrollTop = body.scrollHeight;

                    // 清除该聊天的未读角标
                    var badge = document.getElementById('badge-' + chatId);
                    if (badge) badge.style.display = 'none';
                })
                .catch(function() {
                    body.innerHTML = '<div class="msg-empty"><i class="fas fa-exclamation-circle"></i>加载失败，请重试</div>';
                });
        }

        function closeChat() {
            currentChat = null;
            document.getElementById('msgChatView').classList.remove('active');
            document.getElementById('msgListView').style.display = '';
            document.getElementById('messageTabs').style.display = '';
            document.getElementById('bottomNav').style.display = '';
            // 刷新未读数
            loadUnreadCounts();
        }

        document.getElementById('chatBackBtn').addEventListener('click', closeChat);

        function appendBubble(type, text, time) {
            var body = document.getElementById('chatBody');
            // 移除空状态提示
            var empty = body.querySelector('.msg-empty');
            if (empty) empty.remove();

            var div = document.createElement('div');
            div.className = 'msg-bubble ' + type;
            div.textContent = text;
            if (time) {
                var span = document.createElement('span');
                span.className = 'bubble-time';
                span.textContent = time;
                div.appendChild(span);
            }
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
        }

        function appendCard(text, time) {
            var body = document.getElementById('chatBody');
            var card = document.createElement('div');
            card.className = 'msg-card';
            var contentDiv = document.createElement('div');
            contentDiv.className = 'card-content';
            contentDiv.textContent = text;
            card.appendChild(contentDiv);
            if (time) {
                var timeDiv = document.createElement('div');
                timeDiv.className = 'card-time';
                timeDiv.textContent = time;
                card.appendChild(timeDiv);
            }
            body.appendChild(card);
            body.scrollTop = body.scrollHeight;
        }

        function sendMessage() {
            var input = document.getElementById('chatInput');
            var text = input.value.trim();
            if (!text || !currentChat) return;
            if (notificationTypes.indexOf(currentChat) !== -1) return;

            var timeStr = formatTime(new Date());
            appendBubble('sent', text, timeStr);
            input.value = '';

            // 发送到后端
            fetch('/api/user/message/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chatType: currentChat, content: text })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.success) {
                    appendBubble('received', '消息发送失败: ' + (data.error || '未知错误'), formatTime(new Date()));
                }
                // 更新列表预览
                var preview = document.getElementById('preview-' + currentChat);
                if (preview) preview.textContent = text;
                var timeEl = document.getElementById('time-' + currentChat);
                if (timeEl) timeEl.textContent = timeStr;
            })
            .catch(function() {
                appendBubble('received', '网络错误，消息发送失败', formatTime(new Date()));
            });
        }

        document.getElementById('chatSendBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
</html>
